    { name = "opening_angle", type = "both" ,parameters = [1.0]},
    { name = "opening_angle_proton", type = "both" },
    { name = "opening_angle_pion_proton", type = "both" },
    { name = "dpT",           type = "both" },
    { name = "dalphaT",       type = "both" },
    { name = "dpL",           type = "both" },
    { name = "muon_cos_angle",     type = "both"},
    { name = "pion_cos_angle",     type = "both"},
    { name = "four_mom_transfer_squared",     type = "both"},
    { name = "four_mom_transfer_squared_calo",     type = "both"},
    { name = "hadronic_invariant_mass", type = "true" },
    { name = "hadron_invariant_mass_hadron", type = "both" },
    { name = "hadron_invariant_mass_general",     type = "both"},
    { name = "hadron_invariant_mass_general_calo",     type = "both"},
    { name = "p_pi_invariant_mass",     type = "both"},
    { name = "cos_angle_proton_pion",     type = "both"},
    { name = "energy_init", type = "true" },
    { name = "momentum_transfer", type = "true" },
    { name = "q3_transfer",     type = "both"},
    { name = "q0_transfer",     type = "both"},
    { name = "Q2_exp", type = "true" },
    { name = "W_exp", type = "true" },
    { name = "muon_pT_wrt_beam", type = "both" },
    { name = "pion_michel_tag", type = "both", parameters = [20.0]},

    # Leading MUON particle-level
    { name = "ke",                type = "both_particle", selector = "leading_muon" },
    { name = "length",            type = "both_particle", selector = "leading_muon" },
    { name = "dpT",               type = "both_particle", selector = "leading_muon" },
    { name = "polar_angle",       type = "both_particle", selector = "leading_muon" },
    { name = "azimuthal_angle",   type = "both_particle", selector = "leading_muon" },
    { name = "cos_wrt_beam",   type = "both_particle", selector = "leading_muon" },

    # Leading PION particle-level
    { name = "ke",                type = "both_particle", selector = "leading_pion" },
    { name = "length",            type = "both_particle", selector = "leading_pion" },
    { name = "dpT",               type = "both_particle", selector = "leading_pion" },
    { name = "polar_angle",       type = "both_particle", selector = "leading_pion" },
    { name = "azimuthal_angle",   type = "both_particle", selector = "leading_pion" },
    { name = "cos_wrt_beam",   type = "both_particle", selector = "leading_pion" },

    # Leading PION particle-level
    { name = "ke",                type = "both_particle", selector = "leading_proton" },
    { name = "length",            type = "both_particle", selector = "leading_proton" },
    { name = "dpT",               type = "both_particle", selector = "leading_proton" },
    { name = "polar_angle",       type = "both_particle", selector = "leading_proton" },
    { name = "azimuthal_angle",   type = "both_particle", selector = "leading_proton" },
    { name = "cos_wrt_beam",   type = "both_particle", selector = "leading_proton" },

    { name = "containment",   type = "both_particle", selector = "leading_muon" },
    { name = "containment",   type = "both_particle", selector = "leading_pion" },
    { name = "containment",   type = "both_particle", selector = "leading_proton" },
]

