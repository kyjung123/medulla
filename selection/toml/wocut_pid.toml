[general]
output = "/exp/icarus/data/users/kyjung/NuMI_1pi1p/wo_cut_PID"
primfn = "default_primary_classification"
pidfn = "default_pid"

[[category]] # 0 : Fiducial, single muon, single pion
cuts = [
    { name = "neutrino"        },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = [143.425] },
    { name = "single_pion",    parameters = [25.0] },
]

[[category]] # 1 : Single muon, multiple pion
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = [143.425] },
    { name = "!no_charged_pions", parameters = [25.0] },
    { name = "!single_pion",    parameters = [25.0] },
]

[[category]] # 2 : Single muon, zero pion
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = [143.425] },
    { name = "no_charged_pions", parameters = [25.0] },
]

[[category]] # 3 : Neutrino, charged current
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "iscc"     },
]

[[category]] # 4 : Neutrino, neutral current
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "!iscc"    },
]

[[category]] # 5 : Out of FV
cuts = [
    { name = "!fiducial_cut" },
    { name = "neutrino" },
]

[[category]] # 6 : Cosmic
cuts = [
    { name = "!neutrino" },
]

[[sample]]
name = "nominal"
path = "/pnfs/icarus/persistent/users/dcarber/spine/combined_files/NuMI_CV_flat_cafs_2/NuMI_CV_flat_cafs_2_0*.root"
ismc = true
disable = false





[[tree]]
name = "selected"
sim_only = false
add_exposure = true
mode = "reco"
cut = [
    { name = "neutrino",              type = "true" },
]
branch = [
    { name = "primary_softmax",   type = "reco_particle", selector = "leading_muon"   },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_muon"   },
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_muon"   },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_muon"   },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_muon"   },
    { name = "mip_softmax",       type = "reco_particle", selector = "leading_muon"   },
    { name = "hadron_softmax",    type = "reco_particle", selector = "leading_muon"   },

    { name = "primary_softmax",   type = "reco_particle", selector = "leading_pion"   },
    { name = "secondary_softmax", type = "reco_particle", selector = "leading_pion"   },
    { name = "muon_softmax",      type = "reco_particle", selector = "leading_pion"   },
    { name = "pion_softmax",      type = "reco_particle", selector = "leading_pion"   },
    { name = "proton_softmax",    type = "reco_particle", selector = "leading_pion"   },
    { name = "mip_softmax",       type = "reco_particle", selector = "leading_pion"   },
    { name = "hadron_softmax",    type = "reco_particle", selector = "leading_pion"   },

]




