[general]
output = "/exp/icarus/data/users/kyjung/NUMI_cc1pion/icarus_charged_pion_proton_michel_short_contain_6"
primfn = "default_primary_classification"

pidfn = "default_pid"

fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

[parameters]
photon_threshold = 25.0
electron_threshold = 25.0
muon_threshold = 143.425
pion_threshold = 50.0
proton_threshold = 50.0
flash_low_t = -0.0
flash_high_t = 9.6

[[category]] # 0 : Fiducial, single muon, single pion
cuts = [
    { name = "neutrino"        },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = ["@muon_threshold"] },
    { name = "single_pion",    parameters = ["@pion_threshold"] },
]

[[category]] # 1 : Single muon, multiple pion
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = ["@muon_threshold"] },
    { name = "!no_charged_pions", parameters = ["@pion_threshold"] },
    { name = "!single_pion",    parameters = ["@pion_threshold"] },
]

[[category]] # 2 : Single muon, zero pion
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = ["@muon_threshold"] },
    { name = "no_charged_pions", parameters = ["@pion_threshold"] },
]

[[category]] # 3 : Neutrino, charged current
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "iscc"     },
]

[[category]] # 4 : Neutrino, neutral current
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "!iscc"    },
]

[[category]] # 5 : Out of FV
cuts = [
    { name = "!fiducial_cut" },
    { name = "neutrino" },
]

[[category]] # 6 : Cosmic
cuts = [
    { name = "!neutrino" },
]

[[category]] # 7 : Fiducial, single muon, single pion; signle proton
cuts = [
    { name = "neutrino"        },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = ["@muon_threshold"] },
    { name = "single_pion",    parameters = ["@pion_threshold"] },
    { name = "single_proton",    parameters = ["@proton_threshold"] },
]

[[sample]]
name = "nominal"
path = "/pnfs/icarus/persistent/users/dcarber/spine/combined_files/NuMI_CV_flat_cafs_2/NuMI_CV_flat_cafs_2_06.root"
#path = "/pnfs/icarus/persistent/users/dcarber/spine/combined_files/NuMI_CV_flat_cafs_2/NuMI_CV_flat_cafs_2_0[1-3].root"
#path = "/pnfs/icarus/persistent/users/dcarber/spine/combined_files/NuMI_CV_flat_cafs_2/NuMI_CV_flat_cafs_2_0*.root"
ismc = true
disable = false


