[general]
output = "/exp/icarus/data/users/kyjung/NUMI_cc1pion/icarus_charged_pion_kink_michel_sys_new_test"
primfn = "default_primary_classification"
pidfn = "default_pid"

[[category]] # 0 : Fiducial, single muon, single pion
cuts = [
    { name = "neutrino"        },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = [143.425] },
    { name = "single_pion",    parameters = [25.0] },
]

[[category]] # 1 : Single muon, multiple pion
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = [143.425] },
    { name = "!no_charged_pions", parameters = [25.0] },
    { name = "!single_pion",    parameters = [25.0] },
]

[[category]] # 2 : Single muon, zero pion
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = [143.425] },
    { name = "no_charged_pions", parameters = [25.0] },
]

[[category]] # 3 : Neutrino, charged current
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "iscc"     },
]

[[category]] # 4 : Neutrino, neutral current
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "!iscc"    },
]

[[category]] # 5 : Out of FV
cuts = [
    { name = "!fiducial_cut" },
    { name = "neutrino" },
]

[[category]] # 6 : Cosmic
cuts = [
    { name = "!neutrino" },
]

