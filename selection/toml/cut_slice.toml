[general]
output = "trial"
primfn = "default_primary_classification"

pidfn = "default_pid"

fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

[parameters]
photon_threshold = 25.0
electron_threshold = 25.0
muon_threshold = 143.425
pion_threshold = 50.0
proton_threshold = 50.0
flash_low_t = -0.0
flash_high_t = 9.6

[[category]] # 0 : Fiducial, single muon, single pion, N proton(N>=1)
cuts = [
    { name = "neutrino"        },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = ["@muon_threshold"] },
    { name = "single_pion",    parameters = ["@pion_threshold"] },
    { name = "!no_protons",    parameters = ["@proton_threshold"] },
]
[[category]] # 1 : Fiducial, single muon, single pion, zero proton
cuts = [
    { name = "neutrino"        },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = ["@muon_threshold"] },
    { name = "single_pion",    parameters = ["@pion_threshold"] },
    { name = "no_protons",    parameters = ["@proton_threshold"] },
]

[[category]] # 2 : Single muon, multiple pions (N>1)
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = ["@muon_threshold"] },
    { name = "!no_charged_pions", parameters = ["@pion_threshold"] },
    { name = "!single_pion",    parameters = ["@pion_threshold"] },
]

[[category]] # 3 : Single muon, zero pion
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "no_photons",       parameters = [25.0] },
    { name = "no_electrons",     parameters = [25.0] },
    { name = "single_muon",      parameters = ["@muon_threshold"] },
    { name = "no_charged_pions", parameters = ["@pion_threshold"] },
]

[[category]] # 4 : Neutrino, charged current
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "iscc"     },
]

[[category]] # 5 : Neutrino, neutral current
cuts = [
    { name = "neutrino" },
    { name = "fiducial_cut"    },
    { name = "!iscc"    },
]

[[category]] # 6 : Out of FV
cuts = [
    { name = "!fiducial_cut" },
    { name = "neutrino" },
]

[[category]] # 7 : Cosmic
cuts = [
    { name = "!neutrino" },
]



