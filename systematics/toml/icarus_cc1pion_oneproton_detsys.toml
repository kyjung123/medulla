[input]
path = 'output_selection_merged.root'
weights = '/pnfs/icarus/persistent/users/spine/NuMI/Nu_det_sys/CV/ZExpPCA/*.root.flat_merged_geant4.root'
use_additional_hash = true

[output]
path = 'icarus_charged_pion_proton_michel_recent_sys.root'
histogram_destination = 'variations/'

[[sysvar]]
name = 'reco_leading_muon_ke'
bins = [25, 0, 5000]

[variations]
keys = ['nominal', 'var01m', 'var01p', 'var02m', 'var02p', 'var03m', 'var03p', 'var04m', 'var04p', 'var05', 'var06', 'var07', 'var08', 'var09']
origin = 'events/'
tree = 'selected_one_proton_michel'
result_destination = 'detsys_results/'
variable = 'reco_leading_muon_ke'
bins = [0.0, 100.0, 200.0, 400.0, 600.0, 800.0, 1000.0, 1500.0, 2000.0, 3000.0, 4000.0, 5000.0]
nuniverses = 1000
variable_length = true

# Detector weights are evaluated for the nominal MC trees. The corresponding
# exposure and on-beam trees are copied into the detector-only output.
[[tree]]
origin = 'events/nominal/selected_one_proton_michel'
destination = 'events/nominal/'
name = 'selected_one_proton_michel'
action = 'add_weights'
table_types = ['variation']

[[tree]]
origin = 'events/nominal/selected_one_proton_michel_exposure'
destination = 'events/nominal/'
name = 'selected_one_proton_michel_exposure'
action = 'copy'

[[tree]]
origin = 'events/onbeam/selected_one_proton_michel'
destination = 'events/onbeam/'
name = 'selected_one_proton_michel'
action = 'copy'

[[tree]]
origin = 'events/onbeam/selected_one_proton_michel_exposure'
destination = 'events/onbeam/'
name = 'selected_one_proton_michel_exposure'
action = 'copy'

