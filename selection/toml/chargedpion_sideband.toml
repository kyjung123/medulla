[[tree]]
name = "selected"
sim_only = false
add_exposure = false
mode = "reco"
cut = [
    { name = "fiducial_cut",              type = "reco" },
    { name = "flash_cut",                 type = "reco",  parameters = [0.0, 9.6] },
    { name = "no_photons",                type = "reco",  parameters = [25.0] },
    { name = "no_electrons",              type = "reco",  parameters = [25.0] },
    { name = "single_muon",               type = "reco",  parameters = [143.425] },
    { name = "single_pion",             type = "reco",  parameters = [25.0] },
    { name = "trigger_emulation_cut",     type = "event", decrements_exposure = false },
    { name = "data_quality_cut",          type = "event", decrements_exposure = true },
]
branch = [
    # interaction-level truth/reco branches
    { name = "neutrino_id",             type = "true"    },
    { name = "baseline",                type = "mctruth" },
    { name = "cc",                      type = "mctruth" },
    { name = "pdg",                     type = "mctruth" },
    { name = "interaction_type",        type = "mctruth" },
    { name = "interaction_mode",       type = "mctruth" },
    { name = "category",                type = "true"    },
    { name = "neutrino_energy",         type = "mctruth" },
    { name = "visible_energy",          type = "both"    },
    { name = "visible_energy_calosub",  type = "both"    },
    { name = "photon_multiplicity",     type = "both",    parameters = [25.0]},
    { name = "electron_multiplicity",   type = "both",    parameters = [25.0]},
    { name = "muon_multiplicity",       type = "both",    parameters = [143.425]},
    { name = "pion_multiplicity",       type = "both",    parameters = [25.0]},
    { name = "proton_multiplicity",     type = "both",    parameters = [50.0]},

    # kinematic imbalance & angles
    { name = "opening_angle", type = "both" },
##    { name = "four_mom_transfer_squared",     type = "both"},
##    { name = "q3_transfer",     type = "both"},
##    { name = "q0_transfer",     type = "both"},
    { name = "hadronic_invariant_mass", type = "true" },

    # vertex & flash
    { name = "vertex_x",         type = "both" },
    { name = "vertex_y",         type = "both" },
    { name = "vertex_z",         type = "both" },
    { name = "containment",      type = "both" },
    { name = "fiducial",         type = "both" },

    # leading muon interaction-level
    { name = "end_x",             type = "both_particle", selector = "leading_muon"   },
    { name = "end_y",             type = "both_particle", selector = "leading_muon"   },
    { name = "end_z",             type = "both_particle", selector = "leading_muon"   },
    { name = "px",             type = "both_particle", selector = "leading_muon" },
    { name = "py",             type = "both_particle", selector = "leading_muon" },
    { name = "pz",             type = "both_particle", selector = "leading_muon" },
    { name = "ke",                type = "both_particle", selector = "leading_muon"   },
    { name = "length",            type = "both_particle", selector = "leading_muon"   },
    { name = "polar_angle",       type = "both_particle", selector = "leading_muon" },
    { name = "azimuthal_angle",   type = "both_particle", selector = "leading_muon" },
    { name = "cos_wrt_beam",   type = "both_particle", selector = "leading_muon" },
    { name = "containment",   type = "both_particle", selector = "leading_muon" },
    { name = "primary_classification",   type = "both_particle", selector = "leading_muon" },

    # leading pion particle-level
    { name = "end_x",             type = "both_particle", selector = "leading_pion" },
    { name = "end_y",             type = "both_particle", selector = "leading_pion" },
    { name = "end_z",             type = "both_particle", selector = "leading_pion" },
    { name = "px",             type = "both_particle", selector = "leading_pion" },
    { name = "py",             type = "both_particle", selector = "leading_pion" },
    { name = "pz",             type = "both_particle", selector = "leading_pion" },
    { name = "ke",                type = "both_particle", selector = "leading_pion" },
    { name = "length",            type = "both_particle", selector = "leading_pion" },
    { name = "polar_angle",       type = "both_particle", selector = "leading_pion" },
    { name = "azimuthal_angle",   type = "both_particle", selector = "leading_pion" },
    { name = "cos_wrt_beam",   type = "both_particle", selector = "leading_pion" },
    { name = "containment",   type = "both_particle", selector = "leading_pion" },
    { name = "primary_classification",   type = "both_particle", selector = "leading_pion" },
]


